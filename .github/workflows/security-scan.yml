name: Security Scan

on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Aikido MCP
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          claude mcp add aikido \
            --transport stdio \
            --env AIKIDO_API_KEY=$AIKIDO_API_KEY \
            -- npx -y @aikidosec/mcp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|ts|jsx|tsx|java|py|go|rb|php)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -z "$FILES" ]; then
            echo "No code files changed"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changed files:"
            echo "$FILES"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Security Scan
        if: steps.changed.outputs.skip == 'false'
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RESULT=$(claude -p "
          You are a security scanner. Use the aikido_full_scan tool to scan code.

          ## Changed Files
          ${{ steps.changed.outputs.files }}

          ## Instructions

          1. Read each changed file using the Read tool
          2. Call mcp__aikido__aikido_full_scan with the file contents
          3. Analyze findings and determine status

          ## Output Format (follow exactly)

          ## Security Scan Results

          **Status:** PASS or FAIL (FAIL if any Critical or High severity issues)

          **Files Scanned:** (count)

          ### Findings

          | Severity | File | Line | Issue |
          |----------|------|------|-------|
          (table rows for each finding, or 'No issues found')

          ### Summary

          (1-2 sentence summary)

          ---
          *Scanned by Claude + Aikido*
          " --allowedTools "mcp__aikido__aikido_full_scan,Read" --print)

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Check if FAIL is in the result
          if echo "$RESULT" | grep -q "Status:\*\* FAIL"; then
            echo "status=fail" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      - name: Post PR Comment
        if: steps.changed.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.scan.outputs.result }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result
            });

      - name: Fail if security issues found
        if: steps.scan.outputs.status == 'fail'
        run: |
          echo "Security issues found! Failing the build."
          exit 1

      - name: Skip message
        if: steps.changed.outputs.skip == 'true'
        run: echo "No code files changed, skipping security scan"
