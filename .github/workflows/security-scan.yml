name: Security Scan

on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI and Aikido MCP
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install -g @aikidosec/mcp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|ts|jsx|tsx|java|py|go|rb|php)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -z "$FILES" ]; then
            echo "No code files changed"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Changed files:"
            echo "$FILES"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Security Scan
        if: steps.changed.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          # Configure Claude with Aikido MCP
          mkdir -p ~/.claude

          cat > ~/.claude.json << EOF
          {
            "projects": {
              "$(pwd)": {
                "mcpServers": {
                  "aikido": {
                    "type": "stdio",
                    "command": "npx",
                    "args": ["-y", "@aikidosec/mcp"],
                    "env": {
                      "AIKIDO_API_KEY": "${AIKIDO_API_KEY}"
                    }
                  }
                }
              }
            }
          }
          EOF

          echo "Claude config:"
          cat ~/.claude.json

          # Run Claude with the scan
          claude -p "
          You are a security scanner. You MUST use the aikido_full_scan tool to scan code.

          ## Changed Files
          ${{ steps.changed.outputs.files }}

          ## Instructions

          1. First, read each changed file listed above using the Read tool
          2. Then call mcp__aikido__aikido_full_scan with the file contents
          3. Report the findings from Aikido

          IMPORTANT: You must use the mcp__aikido__aikido_full_scan tool. Do not do manual analysis.

          ## Output Format

          ## Security Scan Results

          **Status:** PASS | FAIL
          **Files Scanned:** (count)

          ### Aikido Findings

          (List each finding from the Aikido scan)

          ### Summary

          (1-2 sentence summary)
          " --allowedTools "mcp__aikido__aikido_full_scan,mcp__aikido__aikido_sast_scan,mcp__aikido__aikido_secrets_scan,Read,Glob" --print

      - name: Skip message
        if: steps.changed.outputs.skip == 'true'
        run: echo "No code files changed, skipping security scan"
