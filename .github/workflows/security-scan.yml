name: Security Scan

on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Aikido MCP
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          claude mcp add aikido \
            --transport stdio \
            --env AIKIDO_API_KEY=$AIKIDO_API_KEY \
            -- npx -y @aikidosec/mcp

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|ts|jsx|tsx|java|py|go|rb|php)$' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ -z "$FILES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Security Scan
        if: steps.changed.outputs.skip == 'false'
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          RESULT=$(claude -p "
          You are a security scanner. Use the aikido_full_scan tool.

          ## Changed Files
          ${{ steps.changed.outputs.files }}

          ## Instructions

          1. Read each changed file
          2. Call mcp__aikido__aikido_full_scan with the file contents
          3. Report findings

          ## Output Format

          ## Security Scan Results

          **Status:** PASS or FAIL

          **Files Scanned:** (count)

          ### Findings

          | Severity | File | Line | Issue |
          |----------|------|------|-------|
          (table of findings or 'No issues found')

          ### Summary

          (1-2 sentences)

          ---
          *Scanned by Claude + Aikido*
          " --allowedTools "mcp__aikido__aikido_full_scan,Read" --print)

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$RESULT" | grep -q "**Status:** FAIL"; then
            echo "status=fail" >> $GITHUB_OUTPUT
          else
            echo "status=pass" >> $GITHUB_OUTPUT
          fi

      - name: Post Scan Results
        if: steps.changed.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.scan.outputs.result }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result
            });

      - name: Auto-fix Security Issues
        if: steps.scan.outputs.status == 'fail'
        id: autofix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Create fix branch
          FIX_BRANCH="fix/security-pr-${{ github.event.number }}"
          git checkout -b "$FIX_BRANCH"

          # Run Claude to fix the issues
          claude -p "
          You are a security engineer. Fix the security vulnerabilities in the code.

          ## Files to Fix
          ${{ steps.changed.outputs.files }}

          ## Instructions

          1. Read each file listed above
          2. Scan with mcp__aikido__aikido_full_scan to identify issues
          3. Fix each security vulnerability:
             - SQL Injection: Use parameterized queries
             - Command Injection: Use safe APIs, validate input
             - XSS: Sanitize output, use proper encoding
             - Path Traversal: Validate paths, use allowlists
             - Hardcoded Secrets: Use environment variables
          4. Write the fixed files using the Write tool
          5. After fixing, re-scan to verify fixes work

          IMPORTANT: Actually edit the files. Do not just report what to do.
          " --allowedTools "mcp__aikido__aikido_full_scan,Read,Write,Edit" --print

          # Check if any files were modified
          if git diff --quiet; then
            echo "No fixes applied"
            echo "fixed=false" >> $GITHUB_OUTPUT
          else
            echo "Fixes applied"
            echo "fixed=true" >> $GITHUB_OUTPUT
            echo "branch=$FIX_BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Fixes
        if: steps.autofix.outputs.fixed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "fix: Auto-fix security vulnerabilities

          Automated fixes for security issues found in PR #${{ github.event.number }}

          Co-Authored-By: Claude <noreply@anthropic.com>"

          git push origin "${{ steps.autofix.outputs.branch }}"

      - name: Create Fix PR
        if: steps.autofix.outputs.fixed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `fix: Security fixes for PR #${{ github.event.number }}`,
              head: '${{ steps.autofix.outputs.branch }}',
              base: '${{ github.head_ref }}',
              body: `## Automated Security Fixes

            This PR contains automated fixes for security vulnerabilities found in #${{ github.event.number }}.

            ### What was fixed
            - Security issues identified by Aikido scan
            - Fixes applied by Claude

            ### Review Checklist
            - [ ] Verify fixes are correct
            - [ ] Ensure no functionality is broken
            - [ ] Merge into original PR branch

            ---
            *Auto-generated by Claude + Aikido Security Scan*`
            });

            // Comment on original PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔧 Auto-Fix PR Created

            I've created a PR with fixes for the security issues: #${pr.number}

            Please review the fixes and merge into this branch if they look correct.`
            });

      - name: Fail if unfixed issues
        if: steps.scan.outputs.status == 'fail'
        run: |
          echo "Security issues were found. Check the auto-fix PR for proposed solutions."
          exit 1

      - name: Skip message
        if: steps.changed.outputs.skip == 'true'
        run: echo "No code files changed, skipping security scan"
